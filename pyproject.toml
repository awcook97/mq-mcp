[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mq-mcp"
version = "0.1.0"
description = "MCP server for MacroQuest Lua scripting assistance"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "protobuf>=5.0",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60",
]

[project.scripts]
mq-mcp = "server:main"

[tool.setuptools.packages.find]
where = ["."]
